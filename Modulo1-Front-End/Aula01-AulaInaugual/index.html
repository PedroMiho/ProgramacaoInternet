<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário Cadastro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>    
    <main>

        <h2 id="subtitulo" class="umc">Formulário CEP</h2>
        <!-- Paragrafos -->
        <p class="umc">Nesse formulário vamos entender como consumir a API pública do ViaCEP</p>

        <form action="">

            <label for="cep">CEP</label>
            <input type="number" id="cep" name="nome" required>

            <label for="rua">Rua</label>
            <input type="text" id="rua" name="rua" readonly>

            <label for="numero">Número</label>
            <input type="text" id="numero" name="numero" required>

            <label for="bairo">Bairro</label>
            <input type="text" id="bairro" name="bairro" readonly>

            <label for="cidade">Cidade</label>
            <input type="text" id="cidade" name="cidade" readonly>

            <label for="estado">Estado</label>
            <input type="text" id="estado" name="estado" readonly>

            <div>
                <button type="submit">Enviar</button>
                <button type="reset">Limpar</button>
            </div>

            
        </form>

    </main>

    <script src="script.js"></script>

</body>
</html>
