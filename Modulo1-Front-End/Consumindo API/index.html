<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Consulta de CEP</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container py-5">

        <div class="row justify-content-center">

            <div class="col-12 col-md-9 col-lg-7">

                <div class="cep-card">

                    <!-- Cabeçalho -->
                    <div class="header text-center">

                        <div class="header-icon">
                            <i class="bi bi-geo-alt-fill"></i>
                        </div>

                        <h1>Consultar endereço</h1>

                        <p>
                            Digite um CEP para consultar automaticamente
                            os dados do endereço.
                        </p>

                    </div>


                    <div class="content">

                        <!-- CEP -->
                        <div class="cep-area">

                            <label for="cep" class="form-label">
                                CEP
                            </label>

                            <div class="cep-input">

                                <i class="bi bi-mailbox"></i>

                                <input
                                    type="text"
                                    id="cep"
                                    name="cep"
                                    maxlength="8"
                                    placeholder="Digite o CEP"
                                    autocomplete="postal-code">

                                <button type="button">
                                    <i class="bi bi-search"></i>
                                    Consultar
                                </button>

                            </div>

                            <p id="erro"></p>

                            <small>
                                Digite apenas os 8 números do CEP.
                            </small>

                        </div>


                        <!-- ENDEREÇO -->
                        <div class="address">

                            <div class="address-title">

                                <i class="bi bi-house-door"></i>

                                <div>
                                    <h2>Endereço encontrado</h2>
                                    <span>Os dados serão preenchidos automaticamente</span>
                                </div>

                            </div>


                            <div class="row">

                                <div class="col-12 mb-3">

                                    <label for="rua" class="form-label">
                                        Rua
                                    </label>

                                    <div class="input-group-custom readonly">

                                        <i class="bi bi-signpost-2"></i>

                                        <input
                                            type="text"
                                            id="rua"
                                            name="rua"
                                            readonly>

                                    </div>

                                </div>


                                <div class="col-md-6 mb-3">

                                    <label for="bairro" class="form-label">
                                        Bairro
                                    </label>

                                    <div class="input-group-custom readonly">

                                        <i class="bi bi-buildings"></i>

                                        <input
                                            type="text"
                                            id="bairro"
                                            name="bairro"
                                            readonly>

                                    </div>

                                </div>


                                <div class="col-md-6 mb-3">

                                    <label for="cidade" class="form-label">
                                        Cidade
                                    </label>

                                    <div class="input-group-custom readonly">

                                        <i class="bi bi-building"></i>

                                        <input
                                            type="text"
                                            id="cidade"
                                            name="cidade"
                                            readonly>

                                    </div>

                                </div>


                                <div class="col-md-4 mb-3">

                                    <label for="estado" class="form-label">
                                        Estado
                                    </label>

                                    <div class="input-group-custom readonly">

                                        <i class="bi bi-map"></i>

                                        <input
                                            type="text"
                                            id="estado"
                                            name="estado"
                                            readonly>

                                    </div>

                                </div>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </main>


    <script src="buscaCEP.js"></script>

</body>

</html>
